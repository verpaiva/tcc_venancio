<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>LeIA – Perfil</title>
</head>

<body data-page="profile" data-nav="1">
    <div class="top">
        <h1>Perfil</h1><span class="avatar">🐯</span>
    </div>
    <form id="pf" novalidate class="panel" style="margin-top:14px"><input class="field" id="pname"
            aria-label="Nome"><input class="field" id="pmail" type="email" aria-label="E-mail"><label
            for="page">Idade</label><input type="range" id="page" min="3" max="14"><button class="btn">Salvar
            alterações</button></form>
    <button class="btn" id="reset" type="button" style="background:#ffd3b0">Apagar progresso</button><button class="btn"
        id="out" type="button" style="background:#eee">Sair</button>
    <dialog id="dlg">
        <h2 style="margin-top:0">Apagar progresso?</h2>
        <p>Suas histórias geradas e o progresso de leitura serão removidos.</p>
        <menu><button class="btn" id="no" style="background:#eee">Cancelar</button><button class="btn"
                id="yes">Apagar</button></menu>
    </dialog>
    <script src="main.js"></script>
</body>

</html>
