<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>LeIA – Criar conta</title>
</head>

<body data-page="index" class="no-nav">
    <h1 class="logo" aria-label="LeIA"><small>✦</small>Le<b>IA</b></h1>
    <form id="form" novalidate>
        <div class="panel">
            <h1>Seja bem vindo!</h1>
            <input class="field" id="name" placeholder="Digite o seu nome:" aria-label="Nome" autocomplete="name">
            <input class="field" id="email" type="email" placeholder="E-mail:" aria-label="E-mail" autocomplete="email">
            <input class="field" id="pass" type="password" placeholder="Senha:" aria-label="Senha"
                autocomplete="new-password">
            <label for="age">Qual a sua idade? <span id="ageOut"></span></label><input type="range" id="age" min="3"
                max="14" value="3">
        </div>
        <button class="btn">Continuar</button>
    </form><a class="link" href="login.html">Já tenho conta</a>
    <script src="main.js"></script>
</body>

</html>
